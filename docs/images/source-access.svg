<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" width="960" height="336" role="img" aria-labelledby="t d">
  <title id="t">What each source gives you</title>
  <desc id="d">Search and direct download: Poly Haven, ambientCG, BlenderKit (free), Kenney, Polyfork (free), TextureCan, HDRMaps (free). Search and a link to the asset page: CGBookcase, ShareTextures, Quaternius, 3DTextures.me, 3DTexel, Textures.com, HDRI Hub, CGTrader, itch.io. A link to the site's own search: Fab, Poliigon, TurboSquid.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { fill: #f0eef7; font-size: 16.5px; font-weight: 700; }
    .sub { fill: #a29eb6; font-size: 13.5px; }
    .name { fill: #e2dff0; font-size: 14.5px; }
    .free { fill: #8a85a3; font-size: 13px; }
    .count { font-size: 12.5px; font-weight: 700; }
  </style>
  <rect width="960" height="336" rx="18" fill="#13111c"/>
  <rect x="0.5" y="0.5" width="959" height="335" rx="17.5" fill="none" stroke="#2a2638"/>

