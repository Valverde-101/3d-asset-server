<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Asset Search</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235b6cff' stroke-width='2'%3E%3Cpath d='M12 2 3 7v10l9 5 9-5V7z'/%3E%3Cpath d='M3 7l9 5 9-5M12 12v10'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #16181d; --muted: #646b78; --line: #e3e6eb;
    --accent: #4f5ff0; --accent-text: #ffffff; --chip: #eef0f4; --good: #12805c; --warn: #a15c00; --bad: #c0362c;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a21; --text: #e8eaef; --muted: #9aa2b1; --line: #2a2f3a;
      --accent: #7b88ff; --accent-text: #0f1115; --chip: #222733; --good: #4cc79b; --warn: #e6a446; --bad: #ff7b70;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px; }
  .top { display: flex; align-items: center; gap: 12px; padding: 14px 0 10px; }
  .brand { font-weight: 650; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  form.search { flex: 1; display: flex; gap: 8px; }
  input[type=search], input[type=password], select {
    font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 12px; min-width: 0;
  }
  input[type=search] { flex: 1; font-size: 15px; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button, .btn {
    font: inherit; cursor: pointer; border-radius: 8px; padding: 9px 14px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
  }
  button.primary, .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .55; cursor: default; }
  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding-bottom: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; user-select: none; }
  .chip[aria-pressed=true] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  label.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
  details.sources-pick { font-size: 13px; color: var(--muted); }
  details.sources-pick summary { cursor: pointer; }
  .pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 12px; padding: 8px 0 4px; }
  main { padding: 16px 0 48px; }
  .status { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; font-size: 12px; }
  .src { border-radius: 6px; padding: 3px 8px; background: var(--chip); color: var(--muted); text-decoration: none; }
  .src b { color: var(--text); font-weight: 600; }
  .src.error, .src.timeout { color: var(--bad); }
  .src.link { color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow);
          display: flex; flex-direction: column; cursor: pointer; text-align: left; padding: 0; }
  .card:hover { border-color: var(--accent); }
  .thumb { aspect-ratio: 4 / 3; width: 100%; background: var(--chip); object-fit: cover; display: block; }
  .empty { display: grid; place-items: center; color: var(--muted); font-size: 12px; }
  .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; align-self: stretch; text-align: left; }
  .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { font-size: 11px; border-radius: 5px; padding: 1px 6px; background: var(--chip); color: var(--muted); }
  .tag.free { color: var(--good); }
  .tag.paid { color: var(--warn); }
  .tag.dl { color: var(--accent); }
  .empty-state { text-align: center; color: var(--muted); padding: 56px 0; }
  .more { display: flex; justify-content: center; margin-top: 20px; }
  .err { color: var(--bad); }
  /* Detail drawer */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 10; }
  aside.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--panel); z-index: 11;
                 border-left: 1px solid var(--line); overflow-y: auto; padding: 16px 20px 28px; }
  .drawer h2 { margin: 6px 0 4px; font-size: 19px; }
  .drawer .hero { width: 100%; display: block; object-fit: contain; border-radius: 10px; background: var(--chip); aspect-ratio: 4 / 3; }
  .drawer .close { float: right; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; margin: 12px 0; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .desc { color: var(--muted); white-space: pre-line; }
  .dlbox { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .dlbox .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .files { font-size: 12px; color: var(--muted); margin: 0; padding-left: 18px; max-height: 160px; overflow: auto; }
  .note { font-size: 12px; color: var(--muted); }
  .keybar { display: flex; gap: 8px; align-items: center; padding: 10px 0; }
  @media (max-width: 640px) {
    .top { flex-wrap: wrap; }
    .brand { width: 100%; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M3 7l9 5 9-5M12 12v10"/></svg>
        3D Asset Search
      </div>
      <form class="search" id="form" role="search">
        <input type="search" id="q" placeholder="low poly tree, brick wall, sunset hdri…" aria-label="Search assets" autocomplete="off">
        <button class="primary" type="submit">Search</button>
      </form>
    </div>
    <div class="filters">
      <div class="chips" id="types" aria-label="Asset types"></div>
      <label class="toggle"><input type="checkbox" id="free"> Free only</label>
      <label class="toggle"><input type="checkbox" id="downloadable"> Direct download</label>
      <details class="sources-pick" id="sourcesPick">
        <summary>Sources: <span id="sourcesLabel">all</span></summary>
        <div class="pick-grid" id="sourceList"></div>
      </details>
    </div>
    <div class="keybar" id="keybar" hidden>
      <span class="note">This server needs an API key.</span>
      <input type="password" id="key" placeholder="API key">
      <button id="saveKey" type="button">Save</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="status" id="status"></div>
  <div class="grid" id="results"></div>
  <div class="empty-state" id="empty">Search Poly Haven, ambientCG, Kenney, BlenderKit, itch.io and more at once.</div>
  <div class="more"><button id="more" hidden>Load more</button></div>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="dTitle"></aside>

<script>
(function () {
  "use strict";
  var TYPES = [["model", "Models"], ["material", "Materials"], ["texture", "Textures"], ["hdri", "HDRIs"],
               ["sprite", "Sprites"], ["ui", "UI"], ["audio", "Audio"], ["pack", "Packs"]];
  var PAGE = 24;
  var $ = function (id) { return document.getElementById(id); };
  var state = { query: "", offset: 0, results: [], seen: {}, providers: [], selectedSources: null, loading: false };
  var KEY_STORE = "asset-server-key";

  function getKey() { try { return localStorage.getItem(KEY_STORE) || ""; } catch (e) { return ""; } }
  function setKey(k) { try { localStorage.setItem(KEY_STORE, k); } catch (e) {} }

  function api(path) {
    var headers = {};
    var key = getKey();
    if (key) headers["x-api-key"] = key;
    return fetch(path, { headers: headers }).then(function (res) {
      if (res.status === 401) { $("keybar").hidden = false; throw new Error("Unauthorized: enter the API key above."); }
      return res.json().then(function (body) {
        if (!res.ok) throw new Error(body && body.error ? body.error : "HTTP " + res.status);
        return body;
      });
    });
  }

  // Only ever put http(s) URLs into href/src: results come from scraped third-party sites.
  function safeUrl(u) {
    try { var p = new URL(u, location.href); return p.protocol === "https:" || p.protocol === "http:" ? p.href : ""; }
    catch (e) { return ""; }
  }

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === undefined || v === null || v === false) return;
      if (k === "text") n.textContent = v;
      else if (k === "class") n.className = v;
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    });
    (children || []).forEach(function (c) { if (c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }

  function priceTag(a) {
    if (!a.price) return null;
    if (a.price.free) return el("span", { class: "tag free", text: "Free" });
    var label = a.price.amount != null ? (a.price.amount + " " + (a.price.currency || "")).trim() : "Paid";
    return el("span", { class: "tag paid", text: label });
  }

  function thumb(a, cls) {
    var src = safeUrl(a.thumbnailUrl || "");
    if (!src) return el("div", { class: cls + " empty", text: a.type });
    var img = el("img", { class: cls, src: src, alt: "", loading: "lazy", referrerpolicy: "no-referrer" });
    img.addEventListener("error", function () { img.replaceWith(el("div", { class: cls + " empty", text: a.type })); });
    return img;
  }

  function providerName(id) {
    for (var i = 0; i < state.providers.length; i++) if (state.providers[i].id === id) return state.providers[i].name;
    return id;
  }

  function card(a) {
    return el("button", { class: "card", type: "button", onclick: function () { openDrawer(a); } }, [
      thumb(a, "thumb"),
      el("div", { class: "body" }, [
        el("div", { class: "title", text: a.title, title: a.title }),
        el("div", { class: "meta" }, [
          el("span", { class: "tag", text: providerName(a.provider) }),
          el("span", { class: "tag", text: a.type }),
          priceTag(a),
          a.license ? el("span", { class: "tag", text: a.license.name }) : null,
          a.downloadable ? el("span", { class: "tag dl", text: "↓ direct" }) : null,
        ]),
      ]),
    ]);
  }

  function renderStatus(reports) {
    var box = $("status");
    box.replaceChildren();
    reports.filter(function (r) { return r.status !== "skipped"; }).forEach(function (r) {
      var text, cls = "src " + r.status;
      if (r.status === "ok") text = [el("b", { text: r.name }), " " + r.count];
      else if (r.status === "link") text = [r.name + " ↗"];
      else text = [r.name + " " + r.status];
      var attrs = { class: cls, title: r.error || (r.status === "link" ? "Open this search on " + r.name : r.tookMs + " ms") };
      var url = safeUrl(r.searchUrl || "");
      if (url && r.status !== "ok") { attrs.href = url; attrs.target = "_blank"; attrs.rel = "noopener noreferrer"; }
      box.appendChild(el(url && r.status !== "ok" ? "a" : "span", attrs, text));
    });
  }

  function selectedTypes() {
    return Array.prototype.filter.call($("types").children, function (c) { return c.getAttribute("aria-pressed") === "true"; })
      .map(function (c) { return c.dataset.type; });
  }

  function searchParams(offset) {
    var p = new URLSearchParams();
    p.set("q", state.query);
    var t = selectedTypes();
    if (t.length) p.set("type", t.join(","));
    if ($("free").checked) p.set("free", "true");
    if ($("downloadable").checked) p.set("downloadable", "true");
    if (state.selectedSources) p.set("providers", state.selectedSources.join(","));
    p.set("limit", String(PAGE));
    if (offset) p.set("offset", String(offset));
    return p;
  }

  function syncUrl() {
    var p = searchParams(0);
    p.delete("limit");
    history.replaceState(null, "", "?" + p.toString());
  }

  function runSearch(append) {
    if (state.loading) return;
    if (!append) { state.offset = 0; state.results = []; state.seen = {}; $("results").replaceChildren(); }
    state.loading = true;
    $("more").hidden = true;
    $("empty").hidden = false;
    $("empty").textContent = "Searching " + (state.selectedSources ? state.selectedSources.length : state.providers.length || "all") + " sources…";
    syncUrl();
    api("/v1/search?" + searchParams(state.offset).toString())
      .then(function (res) {
        renderStatus(res.providers);
        var fresh = res.results.filter(function (a) { return !state.seen[a.id] && (state.seen[a.id] = true); });
        state.results = state.results.concat(fresh);
        var grid = $("results");
        fresh.forEach(function (a) { grid.appendChild(card(a)); });
        $("empty").hidden = state.results.length > 0;
        $("empty").textContent = "No results. Try a simpler query, fewer filters, or the source links above.";
        // Another page exists if any source returned a full page.
        var canMore = res.providers.some(function (r) { return r.status === "ok" && r.count >= PAGE; });
        $("more").hidden = !canMore || fresh.length === 0;
        state.offset += PAGE;
      })
      .catch(function (e) {
        $("empty").hidden = false;
        $("empty").replaceChildren(el("span", { class: "err", text: e.message }));
      })
      .finally(function () { state.loading = false; });
  }

  // ---- Detail drawer ----
  function closeDrawer() {
    $("drawer").hidden = true; $("scrim").hidden = true;
    document.body.style.overflow = "";
  }

  function kv(rows) {
    var dl = el("dl", { class: "kv" });
    rows.forEach(function (r) {
      if (r[1] === undefined || r[1] === null || r[1] === "" || (Array.isArray(r[1]) && !r[1].length)) return;
      var v = r[1];
      dl.appendChild(el("dt", { text: r[0] }));
      dl.appendChild(el("dd", {}, [typeof v === "string" || typeof v === "number" ? String(v) : v]));
    });
    return dl;
  }

  function formatBytes(n) {
    if (n == null) return "";
    var u = ["B", "KB", "MB", "GB"], i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return n.toFixed(i ? 1 : 0) + " " + u[i];
  }

  function licenseNode(l) {
    if (!l) return null;
    var url = safeUrl(l.url || "");
    var name = url ? el("a", { href: url, target: "_blank", rel: "noopener noreferrer", text: l.name }) : el("span", { text: l.name });
    var notes = [];
    if (l.commercialUse) notes.push("commercial use OK");
    if (l.attributionRequired) notes.push("attribution required");
    return el("span", {}, [name, notes.length ? " · " + notes.join(", ") : ""]);
  }

  function openDrawer(a) {
    var d = $("drawer");
    var sourceUrl = safeUrl(a.url);
    d.replaceChildren(
      el("button", { class: "close", type: "button", "aria-label": "Close", text: "✕", onclick: closeDrawer }),
      el("div", { class: "note", text: providerName(a.provider) + " · " + a.type }),
      el("h2", { id: "dTitle", text: a.title }),
      thumb(a, "hero"),
      kv([
        ["Price", a.price ? (a.price.free ? "Free" : (a.price.amount != null ? a.price.amount + " " + (a.price.currency || "") : "Paid")) : "Unknown"],
        ["Licence", licenseNode(a.license)],
        ["Author", a.author],
        ["Formats", (a.formats || []).join(", ")],
        ["Resolutions", (a.resolutions || []).join(", ")],
        ["Polygons", a.polyCount],
        ["Animated", a.animated ? "yes" : undefined],
        ["Rigged", a.rigged ? "yes" : undefined],
        ["Tags", (a.tags || []).slice(0, 14).join(", ")],
        ["Asset id", a.id],
      ]),
      a.description ? el("p", { class: "desc", text: a.description }) : null,
      el("div", { class: "row" }, [
        sourceUrl ? el("a", { class: "btn", href: sourceUrl, target: "_blank", rel: "noopener noreferrer", text: "Open on " + providerName(a.provider) + " ↗" }) : null,
      ]),
      el("div", { id: "dlArea" }, [el("p", { class: "note", text: "Loading files…" })])
    );
    $("scrim").hidden = false; d.hidden = false; d.scrollTop = 0;
    document.body.style.overflow = "hidden";
    d.querySelector(".close").focus();

    api("/v1/assets/" + encodeURIComponent(a.id))
      .then(function (full) {
        if ($("dTitle").textContent !== a.title) return; // drawer switched
        if (full.description && !a.description) $("dlArea").before(el("p", { class: "desc", text: full.description }));
        if (full.license && !a.license) $("dlArea").before(kv([["Licence", licenseNode(full.license)]]));
        renderDownload(full);
      })
      .catch(function () {
        $("dlArea").replaceChildren(el("p", { class: "note", text: "No direct downloads from this source; get it on the source page." }));
      });
  }

  function renderDownload(asset) {
    var area = $("dlArea");
    var files = (asset.files || []).filter(function (f) { return !f.requiresAuth; });
    if (!files.length) {
      var links = (asset.files || []).filter(function (f) { return safeUrl(f.url); }).slice(0, 6);
      area.replaceChildren(
        el("p", { class: "note", text: "No direct downloads from this source — download it on the source site." }),
        links.length ? el("ul", { class: "files" }, links.map(function (f) {
          return el("li", {}, [el("a", { href: safeUrl(f.url), target: "_blank", rel: "noopener noreferrer", text: f.filename || f.url })]);
        })) : null
      );
      return;
    }
    var formats = {}, resolutions = {};
    files.forEach(function (f) {
      formats[f.group && f.group !== "maps" && f.group !== f.format ? f.group : f.format] = true;
      if (f.resolution) resolutions[f.resolution] = true;
    });
    var resSorted = Object.keys(resolutions).sort(function (x, y) { return parseFloat(x) - parseFloat(y); });
    var fmtSel = el("select", { "aria-label": "Format" }, [el("option", { value: "", text: "Auto format" })].concat(
      Object.keys(formats).map(function (f) { return el("option", { value: f, text: f }); })));
    var resSel = el("select", { "aria-label": "Resolution", hidden: !resSorted.length }, [el("option", { value: "", text: "Auto (2k)" })].concat(
      resSorted.map(function (r) { return el("option", { value: r, text: r }); })));
    var link = el("a", { class: "btn primary", text: "Download" });
    var list = el("ul", { class: "files" });
    var size = el("span", { class: "note" });

    function refresh() {
      var p = new URLSearchParams();
      if (fmtSel.value) p.set("format", fmtSel.value);
      if (resSel.value) p.set("resolution", resSel.value);
      var key = getKey();
      if (key) p.set("api_key", key);
      var qs = p.toString() ? "?" + p.toString() : "";
      var base = "/v1/assets/" + encodeURIComponent(asset.id);
      link.href = base + "/download" + qs;
      list.replaceChildren(el("li", { text: "…" }));
      api(base + "/files" + qs).then(function (sel) {
        list.replaceChildren.apply(list, sel.files.map(function (f) {
          var extra = (f.includes && f.includes.length) ? " + " + f.includes.length + " companion files" : "";
          return el("li", { text: f.filename + (f.resolution ? " · " + f.resolution : "") + extra });
        }));
        if (!sel.files.length) list.replaceChildren(el("li", { text: "Nothing matches this combination." }));
        size.textContent = sel.totalBytes != null ? formatBytes(sel.totalBytes) : "";
        link.toggleAttribute("aria-disabled", !sel.files.length);
      }).catch(function (e) { list.replaceChildren(el("li", { class: "err", text: e.message })); });
    }
    fmtSel.addEventListener("change", refresh);
    resSel.addEventListener("change", refresh);
    area.replaceChildren(el("div", { class: "dlbox" }, [
      el("div", { class: "row" }, [fmtSel, resSel, link, size]),
      list,
      el("p", { class: "note", text: "Multi-file downloads (e.g. glTF with textures) arrive as one zip." }),
    ]));
    refresh();
  }

  // ---- Setup ----
  function renderSourcePicker() {
    var list = $("sourceList");
    list.replaceChildren();
    state.providers.forEach(function (p) {
      var cb = el("input", { type: "checkbox", value: p.id });
      cb.checked = !state.selectedSources || state.selectedSources.indexOf(p.id) >= 0;
      cb.addEventListener("change", function () {
        var ids = Array.prototype.filter.call(list.querySelectorAll("input"), function (i) { return i.checked; })
          .map(function (i) { return i.value; });
        state.selectedSources = ids.length === state.providers.length ? null : ids;
        $("sourcesLabel").textContent = state.selectedSources ? state.selectedSources.length + " selected" : "all";
      });
      list.appendChild(el("label", { class: "toggle", title: p.description }, [cb, p.name]));
    });
    $("sourcesLabel").textContent = state.selectedSources ? state.selectedSources.length + " selected" : "all";
  }

  function init() {
    var params = new URLSearchParams(location.search);
    var preTypes = (params.get("type") || "").split(",");
    TYPES.forEach(function (t) {
      var chip = el("button", { class: "chip", type: "button", "data-type": t[0], "aria-pressed": preTypes.indexOf(t[0]) >= 0 ? "true" : "false", text: t[1] });
      chip.addEventListener("click", function () {
        chip.setAttribute("aria-pressed", chip.getAttribute("aria-pressed") === "true" ? "false" : "true");
        if (state.query || state.results.length) runSearch(false);
      });
      $("types").appendChild(chip);
    });
    $("free").checked = params.get("free") === "true";
    $("downloadable").checked = params.get("downloadable") === "true";
    if (params.get("providers")) state.selectedSources = params.get("providers").split(",");
    $("q").value = params.get("q") || "";

    ["free", "downloadable"].forEach(function (id) {
      $(id).addEventListener("change", function () { if (state.query || state.results.length) runSearch(false); });
    });
    $("form").addEventListener("submit", function (e) {
      e.preventDefault();
      state.query = $("q").value.trim();
      $("sourcesPick").open = false;
      runSearch(false);
    });
    $("more").addEventListener("click", function () { runSearch(true); });
    $("scrim").addEventListener("click", closeDrawer);
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("drawer").hidden) closeDrawer(); });
    $("saveKey").addEventListener("click", function () { setKey($("key").value.trim()); $("keybar").hidden = true; boot(); });

    boot();
  }

  function boot() {
    api("/v1/providers").then(function (res) {
      state.providers = res.providers;
      renderSourcePicker();
      if ($("q").value) { state.query = $("q").value.trim(); runSearch(false); }
      else $("q").focus();
    }).catch(function (e) { $("empty").replaceChildren(el("span", { class: "err", text: e.message })); });
  }

  init();
})();
</script>
</body>
</html>
